name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Mocha spec file(s) to run instead of the full suite'
        required: false
        default: ''

env:
  NPM_CONFIG_REGISTRY: https://:2024-03-18T23%3A17%3A52.302000Z@time-machines-npm.sealsecurity.io/

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20', '18' ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - run: npm install

    - name: Test
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          CJS_ONLY=1 npm run build && npx mocha ${{ inputs.test-filter }}
        else
          npm test
        fi

    - name: Build
      if: matrix.node-version == '20'
      run: npm run build

    - name: Pack
      if: matrix.node-version == '20'
      run: npm pack

    - name: Upload package
      if: matrix.node-version == '20'
      uses: actions/upload-artifact@v4
      with:
        name: markdown-it-tgz
        path: markdown-it-*.tgz
        if-no-files-found: error
